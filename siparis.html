<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#F5F3EE;color:#22272B;font-size:14px}
a{color:#8A6414;cursor:pointer}
.app{display:flex;min-height:100vh}
/* ---- yan menü ---- */

.logo{padding:20px 18px 14px;color:#fff;font-weight:700;font-size:19px;letter-spacing:.04em}

.side nav .rol{padding:14px 12px 6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5C6975}
.side nav .say{background:#2B3D4E;color:#E5A93D;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;min-width:22px;text-align:center}

.side-foot{padding:12px 14px;border-top:1px solid #233444;font-size:12px}
.side-foot .mut2{color:#63707C;font-size:10.5px;line-height:1.5;margin-top:8px}
.sbtn{display:block;width:100%;text-align:center;background:#223243;color:#B9C4CD;border:none;border-radius:7px;padding:7px;font-size:12px;cursor:pointer;margin-bottom:6px;font-family:inherit}
.sbtn:hover{background:#2B3D4E;color:#fff}
.sbtn.aktif{background:#E5A93D;color:#1B2530;font-weight:700}
/* ---- ana alan ---- */
.main{flex:1;padding:24px 30px 60px;min-width:0}
h1{font-size:21px;margin:0 0 4px}
.sub{color:#6B7480;font-size:13px;margin:0 0 20px}
.card{background:#fff;border:1px solid #E7E2D8;border-radius:12px;padding:18px 20px;margin-bottom:18px}
.card h2{font-size:14px;margin:0 0 12px;color:#3A414A}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid #E7E2D8;border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:23px;margin-top:2px;color:#22272B;white-space:nowrap}
.kpi span{font-size:11.5px;color:#6B7480;text-transform:uppercase;letter-spacing:.05em}
.kpi i{font-style:normal;font-size:11.5px;color:#8A8F98;display:block;margin-top:3px}
.kpi.warn b{color:#C4711A}.kpi.bad b{color:#AE3B32}.kpi.ok b{color:#2C7A39}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8A8F98;padding:8px 10px;border-bottom:1px solid #E7E2D8;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid #F0EDE5;vertical-align:middle}

.tbl tr:hover td{background:#FAF8F3}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.bd.yesil{background:#E4F2E6;color:#2C7A39}
.bd.sari{background:#FBF0DB;color:#9A6414}
.bd.kirmizi{background:#FBE3E1;color:#AE3B32}
.bd.gri{background:#ECEDEF;color:#565D66}
.bd.mavi{background:#E2ECF8;color:#2C5FA8}
.bd.mor{background:#EDE6F6;color:#6B4A9E}
.btn{display:inline-block;background:#E5A93D;color:#1B2530;border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit}
.btn:hover{background:#D89827}
.btn[disabled]{background:#E3DED2;color:#9AA0A8;cursor:not-allowed}
.btn-ghost{display:inline-block;background:#fff;border:1px solid #D8D2C4;color:#3A414A;padding:6px 12px;border-radius:8px;font-size:12.5px;text-decoration:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-ghost:hover{background:#FAF8F3}
.btn-danger{background:#fff;border:1px solid #E4B7B2;color:#AE3B32;border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn-danger:hover{background:#FDF2F1}
.btn-ok{background:#2C7A39;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-ok:hover{background:#246330}
.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #D8D2C4;border-radius:8px;background:#fff;color:#22272B}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(229,169,61,.4);border-color:#E5A93D}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.frm .full{grid-column:1/-1}
.frm label{display:block;font-size:12px;color:#6B7480;margin-bottom:5px;font-weight:600}
.frm input,.frm select,.frm textarea{width:100%}
.mut{color:#8A8F98;font-size:12.5px}
.tnum{font-variant-numeric:tabular-nums}
.bos{text-align:center;color:#8A8F98;padding:26px 10px;font-size:13px}
/* ---- restoran kartları ---- */
.rest-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.rest{background:#fff;border:1px solid #E7E2D8;border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.rest:hover{border-color:#E5A93D;box-shadow:0 6px 18px rgba(24,36,48,.09);transform:translateY(-2px)}
.rest .kapak{height:96px;display:flex;align-items:center;justify-content:center;font-size:40px;position:relative}
.rest .kapak b{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.9);color:#22272B;font-size:11.5px;padding:3px 9px;border-radius:99px}
.rest .gvd{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
.rest h3{margin:0 0 3px;font-size:16px}
.rest .tur{font-size:12px;color:#8A8F98;margin-bottom:10px}
.rest .satir{display:flex;gap:14px;font-size:12px;color:#5B6570;margin-bottom:10px;flex-wrap:wrap}
.rest .alt{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.kapali{opacity:.55}
/* ---- menü ---- */
.menu-wrap{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.kat-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.kat-bar button{background:#fff;border:1px solid #D8D2C4;border-radius:99px;padding:6px 14px;font:inherit;font-size:12.5px;cursor:pointer}
.kat-bar button.on{background:#182430;color:#fff;border-color:#182430}
.urun{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #F0EDE5;align-items:center}
.urun:last-child{border-bottom:none}
.urun .ikon{width:44px;height:44px;border-radius:10px;background:#F5F3EE;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.urun .bilgi{flex:1;min-width:0}
.urun .bilgi b{display:block;font-size:14px;font-weight:600}
.urun .bilgi span{font-size:12px;color:#8A8F98;display:block;margin-top:2px}
.urun .fiyat{font-weight:700;font-size:14.5px;white-space:nowrap;margin-right:6px}
.adet{display:flex;align-items:center;gap:6px}
.adet button{width:28px;height:28px;border-radius:8px;border:1px solid #D8D2C4;background:#fff;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;color:#3A414A}
.adet button:hover{background:#F5F3EE}
.adet b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
/* ---- sepet ---- */
.sepet{position:sticky;top:18px}
.sepet .satir{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px dashed #F0EDE5}
.sepet .satir span{color:#5B6570}
.sepet .tut{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:#5B6570}
.sepet .tut.buyuk{font-size:16px;font-weight:700;color:#22272B;border-top:1px solid #E7E2D8;margin-top:8px;padding-top:10px}
/* ---- durum akışı ---- */
.akis{display:flex;gap:0;margin:6px 0 18px;flex-wrap:wrap}
.akis .adim{flex:1;min-width:110px;text-align:center;position:relative;padding-top:30px}
.akis .adim:before{content:"";position:absolute;top:11px;left:0;right:0;height:3px;background:#E7E2D8}
.akis .adim:first-child:before{left:50%}
.akis .adim:last-child:before{right:50%}
.akis .adim i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:99px;background:#fff;border:3px solid #E7E2D8;font-style:normal;font-size:11px;line-height:16px;color:#fff}
.akis .adim.gecti:before{background:#2C7A39}
.akis .adim.gecti i{background:#2C7A39;border-color:#2C7A39}
.akis .adim.aktif i{background:#E5A93D;border-color:#E5A93D;box-shadow:0 0 0 4px rgba(229,169,61,.25);animation:nb 1.4s infinite}
.akis .adim.aktif:before{background:linear-gradient(90deg,#2C7A39 50%,#E7E2D8 50%)}
@keyframes nb{0%,100%{box-shadow:0 0 0 4px rgba(229,169,61,.28)}50%{box-shadow:0 0 0 8px rgba(229,169,61,.08)}}
.akis .adim b{display:block;font-size:12.5px;font-weight:600}
.akis .adim span{display:block;font-size:11px;color:#8A8F98;margin-top:2px;min-height:14px}
/* ---- zaman çizelgesi ---- */
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid #E7E2D8}
.tl li{position:relative;padding:0 0 16px 14px}
.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-23px;top:3px;width:10px;height:10px;border-radius:99px;background:#E5A93D;border:2px solid #fff;box-shadow:0 0 0 2px #E5A93D}
.tl li.ok:before{background:#2C7A39;box-shadow:0 0 0 2px #2C7A39}
.tl li.bekle:before{background:#fff;box-shadow:0 0 0 2px #D8D2C4}
.tl b{display:block;font-size:13.5px}
.tl span{font-size:12px;color:#8A8F98}
.tl em{font-style:normal;float:right;font-size:12px;color:#5B6570;font-variant-numeric:tabular-nums}
/* ---- ilerleme çubuğu ---- */
.prg{height:9px;border-radius:99px;background:#EDEAE2;overflow:hidden;margin:8px 0 6px}
.prg i{display:block;height:100%;background:#2C7A39;transition:width .5s}
.prg.sari i{background:#E5A93D}.prg.kirmizi i{background:#C4453A}
/* ---- mutfak / kanban ---- */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.kol{background:#EFEDE6;border-radius:12px;padding:10px;min-height:120px}
.kol h3{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#6B7480;display:flex;justify-content:space-between}
.kol h3 em{font-style:normal;background:#fff;border-radius:99px;padding:0 7px;color:#3A414A}
.tik{background:#fff;border:1px solid #E7E2D8;border-left:4px solid #B9C4CD;border-radius:10px;padding:11px 12px;margin-bottom:10px}
.tik.acil{border-left-color:#C4453A;background:#FFFBFA}
.tik.uyari{border-left-color:#E5A93D}
.tik.iyi{border-left-color:#2C7A39}
.tik .ust{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tik .kod{font-weight:700;font-size:13.5px;white-space:nowrap}
.tik ul{margin:6px 0 8px;padding-left:16px;font-size:12.5px;color:#3A414A}
.tik ul li{margin-bottom:2px}
.tik .not{background:#FBF0DB;color:#7A5210;border-radius:6px;padding:5px 8px;font-size:11.5px;margin-bottom:8px}
.tik .sure{display:flex;justify-content:space-between;font-size:11.5px;color:#6B7480;margin-bottom:8px;font-variant-numeric:tabular-nums}
.tik .aksiyon{display:flex;gap:6px;flex-wrap:wrap}
.krm{color:#AE3B32;font-weight:700}
.sar{color:#9A6414;font-weight:700}
.yes{color:#2C7A39;font-weight:700}
/* ---- grafik ---- */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart .c i{display:block;width:100%;background:#E5A93D;border-radius:4px 4px 0 0;min-height:2px}
.chart .c b{font-size:10.5px;color:#6B7480;font-weight:400;margin-top:5px}
.chart .c em{font-size:10.5px;font-style:normal;color:#3A414A;margin-bottom:3px}
/* ---- modal ---- */
#kutu{position:fixed;inset:0;background:rgba(24,36,48,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:60}
#kutu.ac{display:flex}
#kutu .ic{background:#F5F3EE;border-radius:14px;max-width:720px;width:100%;padding:20px 22px 22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#kutu .bslk{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#kutu .bslk h2{margin:0;font-size:17px}
#kutu .kapa{background:none;border:none;font-size:22px;cursor:pointer;color:#6B7480;line-height:1}
/* ---- bildirim ---- */
#tost{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
#tost div{background:#182430;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:gir .25s}
#tost div.ok{background:#2C7A39}#tost div.err{background:#AE3B32}
@keyframes gir{from{transform:translateY(10px);opacity:0}}
.canli{display:inline-block;width:7px;height:7px;border-radius:99px;background:#2C7A39;margin-right:6px;animation:yp 1.6s infinite}
@keyframes yp{50%{opacity:.25}}
@media(max-width:1080px){.kanban{grid-template-columns:repeat(2,1fr)}.menu-wrap{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:760px){.app{flex-direction:column}.side{width:100%;height:auto;position:static}.side nav{display:flex;flex-wrap:wrap}.side nav a{flex:1 1 auto}.side nav .rol{flex:1 0 100%;padding:10px 12px 2px}.main{padding:18px 14px 50px}.kanban{grid-template-columns:1fr}.frm{grid-template-columns:1fr}}
@media print{.side,.bar .filters,.aksiyon{display:none}.main{padding:0}}
</style>
</head>

function dYaz(k,v){try{localStorage.setItem(k,v);}catch(e){_ram[k]=v;}}

 }catch(e){}
}

/* Söz verilen hazırlık süresi (dakika): en uzun ürün + kalabalık payı + teslim payı */
function sozSure(rid,kalemler,tip){
 var enUzun=0,toplamAdet=0;
 for(var i=0;i<kalemler.length;i++){enUzun=Math.max(enUzun,kalemler[i].sure);toplamAdet+=kalemler[i].adet;}
 var yogunluk=aktifSiparisSayisi(rid); /* mutfaktaki kuyruk */
 /* 3 dk: sipariş onayı + mutfağa alınma payı */
 var s=3 + enUzun + Math.max(0,toplamAdet-1)*1.2 + Math.min(8,yogunluk*1.2) + (TESLIM_TIP[tip]?TESLIM_TIP[tip].ek:0);
 return Math.max(8,Math.round(s));
}

 return n;}

  sozDk:0, ekSure:0,

       hazir:0,yolda:Math.round(rnd(35,90)),teslim:Math.round(rnd(90,220))},

 };
 for(var i=0;i<s.kalemler.length;i++)s.araToplam+=s.kalemler[i].fiyat*s.kalemler[i].adet;
 s.servis = s.tip==="magaza" ? 25 : 0;

/* Söz verilen teslim anı */
function hedefTs(s){return s.zaman.yeni + (s.sozDk+s.ekSure)*60000;}
function kalanMs(s){ if(s.durum==="teslim")return hedefTs(s)-s.zaman.teslim;
 if(s.durum==="iptal")return null; return hedefTs(s)-simdi();}
function gecenMs(s){var bit=(s.durum==="teslim"?s.zaman.teslim:(s.durum==="iptal"?s.zaman.iptal:simdi()));return bit-s.zaman.yeni;}
function gecikmeMs(s){var k=kalanMs(s);return (k!=null&&k<0)?-k:0;}
function ilerlemeYuzde(s){
 var top=(s.sozDk+s.ekSure)*60000, g=gecenMs(s);
 return Math.max(3,Math.min(100,Math.round(g/top*100)));}
function sonDurumTs(s){return s.zaman[s.durum]||s.zaman.yeni;}
function sinif(s){ /* aciliyet rengi */
 if(s.durum==="teslim"||s.durum==="iptal")return "iyi";
 var k=kalanMs(s),top=(s.sozDk+s.ekSure)*60000;
 if(k<0)return "acil"; if(k<top*.3)return "uyari"; return "iyi";}

  var s=VERI.siparisler[i]; if(s.durum==="teslim"||s.durum==="iptal"||s.elle)continue;
  var gec=(t-sonDurumTs(s))/1000, n=sonrakiDurum(s), esik=0;
  if(s.durum==="yeni")esik=s.oto.onay;
  else if(s.durum==="onay")esik=s.oto.hazirlik;

  else if(s.durum==="yolda")esik=s.oto.teslim;
  if(n&&gec>=esik){

   if(n==="yolda"&&!s.kurye)s.kurye=sec(KURYELER);

        ortOnay:[],ortHazirlik:[],ortTeslim:[],ortToplam:[],zamaninda:0,zamanliTop:0,urunAdet:0};

  if(s.durum!=="iptal"){o.ciro+=s.toplam; for(var j=0;j<s.kalemler.length;j++)o.urunAdet+=s.kalemler[j].adet;}
  if(s.durum==="teslim"){o.teslim++;
   var a=adimSuresi(s,"yeni","onay"),b=adimSuresi(s,"onay","hazir"),c=adimSuresi(s,"hazir","teslim"),d=toplamSure(s);
   if(a!=null)o.ortOnay.push(a); if(b!=null)o.ortHazirlik.push(b);
   if(c!=null)o.ortTeslim.push(c); if(d!=null)o.ortToplam.push(d);
   o.zamanliTop++; if(zamanindaMi(s))o.zamaninda++;
  } else if(s.durum==="iptal"){o.iptal++;}
  else {o.aktif++; if(gecikmeMs(s)>0)o.gecikmis++;}
 }
 function ort(a){if(!a.length)return null;var t=0;for(var i=0;i<a.length;i++)t+=a[i];return t/a.length;}
 o.ortOnay=ort(o.ortOnay); o.ortHazirlik=ort(o.ortHazirlik);

function saatlikGrafik(liste){
 var say={},enb=0,saatler=[];
 for(var i=0;i<liste.length;i++){var sa=new Date(liste[i].zaman.yeni).getHours();say[sa]=(say[sa]||0)+1;}
 var min=9,max=23;
 for(var s=min;s<=max;s++){saatler.push([s,say[s]||0]);enb=Math.max(enb,say[s]||0);}

/* Sadece süre/ilerleme alanlarını günceller — form ve kaydırma bozulmaz */
function tikGuncelle(){
 var els=document.querySelectorAll("[data-tik]");
 for(var i=0;i<els.length;i++){
  var el=els[i],s=siparis(el.getAttribute("data-kod")); if(!s)continue;
  var tip=el.getAttribute("data-tik");
  if(tip==="gecen")el.textContent=sureStr(gecenMs(s));
  else if(tip==="kalan"){var k=kalanMs(s);el.textContent=sureStr(k);}
  else if(tip==="gecikme")el.textContent=sureStr(gecikmeMs(s));
  else if(tip==="durum")el.textContent=sureStr(simdi()-sonDurumTs(s));
  else if(tip==="prg")el.style.width=ilerlemeYuzde(s)+"%";
 }
 var sa=document.getElementById("saat");
 if(sa)sa.textContent="🕒 "+saatSnStr(simdi());
}
function formAcikMi(){
 var a=document.activeElement;
 return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function dongu(){
 var degisti=otomatik();
 var kutuAcik=document.getElementById("kutu").className==="ac";
 if(degisti&&!formAcikMi()){
  if(kutuAcik){ /* açık detay penceresini de tazele */
   var kodEl=document.querySelector("#kutu [data-kod]");
   ciz(); if(kodEl)detay(kodEl.getAttribute("data-kod"));
  } else ciz();
 }
