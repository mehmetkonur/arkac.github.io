<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lavka Sipariş Merkezi</title>
<meta name="description" content="Lavka kafe & fırın — online sipariş, bar/mutfak ekranı ve sipariş süreç takibi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
 --kagit:#FAF7F1; --kart:#FFFFFF; --kart2:#F4EFE6;
 --murekkep:#22302B; --ikincil:#5F6E66; --soluk:#8B978F; --cizgi:#E6DFD3;
 --panel:#23302B; --panel2:#2E3E37; --panel-yazi:#B6C5BA; --panel-soluk:#7A8C81;
 --bakir:#C0763A; --bakir-koyu:#A56129; --sage:#6E8E72;
 --iyi:#2F7A46; --iyi-bg:#E3F0E6; --uyari:#B67A16; --uyari-bg:#FAF0DC;
 --kotu:#AE3B32; --kotu-bg:#FAE4E1; --notr-bg:#ECE9E2; --bilgi:#2F5E8C; --bilgi-bg:#E3ECF6;
 --golge:0 6px 18px rgba(34,48,43,.08);
 --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --kagit:#151A18; --kart:#1E2523; --kart2:#252E2B;
 --murekkep:#E7EDE8; --ikincil:#A4B0A8; --soluk:#7E8C84; --cizgi:#2F3A36;
 --panel:#101513; --panel2:#212B27; --panel-yazi:#AEBDB2; --panel-soluk:#6E7E74;
 --bakir:#D9904F; --bakir-koyu:#C0763A; --sage:#88A88C;
 --iyi:#6BBF83; --iyi-bg:#1E3325; --uyari:#E0AA4E; --uyari-bg:#33290F;
 --kotu:#E88176; --kotu-bg:#3A201D; --notr-bg:#2A322F; --bilgi:#84B2E0; --bilgi-bg:#1B2837;
 --golge:0 6px 18px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
 --kagit:#151A18; --kart:#1E2523; --kart2:#252E2B;
 --murekkep:#E7EDE8; --ikincil:#A4B0A8; --soluk:#7E8C84; --cizgi:#2F3A36;
 --panel:#101513; --panel2:#212B27; --panel-yazi:#AEBDB2; --panel-soluk:#6E7E74;
 --bakir:#D9904F; --bakir-koyu:#C0763A; --sage:#88A88C;
 --iyi:#6BBF83; --iyi-bg:#1E3325; --uyari:#E0AA4E; --uyari-bg:#33290F;
 --kotu:#E88176; --kotu-bg:#3A201D; --notr-bg:#2A322F; --bilgi:#84B2E0; --bilgi-bg:#1B2837;
 --golge:0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--kagit);color:var(--murekkep);
 font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;font-size:14.5px;line-height:1.5}
h1,h2,h3,.disp{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;text-wrap:balance}
a{color:var(--bakir-koyu);cursor:pointer}
.tnum,.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--bakir);outline-offset:2px}
.app{display:flex;min-height:100vh}
/* ---------- yan panel ---------- */
.side{width:242px;background:var(--panel);color:var(--panel-yazi);display:flex;flex-direction:column;
 position:sticky;top:0;height:100vh;flex-shrink:0}
.marka{padding:22px 20px 16px;border-bottom:1px solid var(--panel2)}
.marka b{display:block;font-family:'Fraunces',serif;font-size:25px;font-weight:600;color:#fff;letter-spacing:.02em}
.marka b i{font-style:normal;color:var(--bakir)}
.marka small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--panel-soluk);margin-top:5px}
.side nav{flex:1;padding:10px;overflow-y:auto}
.side nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;
 color:var(--panel-yazi);text-decoration:none;font-size:14px;margin-bottom:2px}
.side nav a:hover{background:var(--panel2);color:#fff}
.side nav a.on{background:var(--bakir);color:#1B2320;font-weight:600}
.side nav .grp{padding:14px 12px 6px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--panel-soluk)}
.side nav .say{background:var(--panel2);color:var(--bakir);border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;min-width:22px;text-align:center}
.side nav a.on .say{background:rgba(0,0,0,.22);color:#fff}
.yan-alt{padding:12px 14px;border-top:1px solid var(--panel2);font-size:12px}
.sbtn{display:block;width:100%;text-align:center;background:var(--panel2);color:var(--panel-yazi);border:none;
 border-radius:8px;padding:8px;font:inherit;font-size:12px;cursor:pointer;margin-bottom:6px}
.sbtn:hover{filter:brightness(1.2);color:#fff}
.sbtn.aktif{background:var(--bakir);color:#1B2320;font-weight:700}
.yan-alt .kunye{color:var(--panel-soluk);font-size:10.5px;line-height:1.6;margin-top:10px}
/* ---------- ana alan ---------- */
.main{flex:1;min-width:0;padding:26px 30px 64px}
.bslk{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.alt{color:var(--ikincil);font-size:13.5px;margin:0}
.araclar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
.kart h2{font-size:16px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kart h2 span{font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:12px;color:var(--soluk)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
/* ---------- ölçüm kutuları ---------- */
.olcumler{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.olcum{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.olcum:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sage)}
.olcum.uyari:before{background:var(--uyari)}.olcum.kotu:before{background:var(--kotu)}.olcum.iyi:before{background:var(--iyi)}
.olcum span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soluk)}
.olcum b{display:block;font-family:'Fraunces',serif;font-size:27px;font-weight:600;margin-top:3px;white-space:nowrap;letter-spacing:-.01em}
.olcum.uyari b{color:var(--uyari)}.olcum.kotu b{color:var(--kotu)}.olcum.iyi b{color:var(--iyi)}
.olcum i{display:block;font-style:normal;font-size:11.5px;color:var(--soluk);margin-top:3px}
/* ---------- tablolar ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--soluk);
 padding:9px 10px;border-bottom:1px solid var(--cizgi);white-space:nowrap;font-weight:600}
.tbl td{padding:10px;border-bottom:1px solid var(--cizgi);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--kart2)}
.tbl .sag{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sar{overflow-x:auto}
/* ---------- rozet & düğme ---------- */
.rz{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--notr-bg);color:var(--ikincil)}
.rz.iyi{background:var(--iyi-bg);color:var(--iyi)}
.rz.uyari{background:var(--uyari-bg);color:var(--uyari)}
.rz.kotu{background:var(--kotu-bg);color:var(--kotu)}
.rz.bilgi{background:var(--bilgi-bg);color:var(--bilgi)}
.dg{display:inline-block;background:var(--bakir);color:#1B2320;border:none;border-radius:9px;padding:10px 18px;
 font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.dg:hover{background:var(--bakir-koyu);color:#fff}
.dg[disabled]{background:var(--notr-bg);color:var(--soluk);cursor:not-allowed}
.dg-h{display:inline-block;background:var(--kart);border:1px solid var(--cizgi);color:var(--murekkep);padding:7px 13px;
 border-radius:9px;font:inherit;font-size:12.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.dg-h:hover{background:var(--kart2)}
.dg-ok{background:var(--iyi);color:#fff;border:none;border-radius:9px;padding:8px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.dg-ok:hover{filter:brightness(1.08)}
.dg-x{background:var(--kart);border:1px solid var(--kotu);color:var(--kotu);border-radius:9px;padding:7px 11px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.dg-x:hover{background:var(--kotu-bg)}
input,select,textarea{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--cizgi);border-radius:9px;
 background:var(--kart);color:var(--murekkep)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bakir);outline-offset:0;border-color:var(--bakir)}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.frm .tam{grid-column:1/-1}
.frm label{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soluk);margin-bottom:5px;font-weight:600}
.frm input,.frm select,.frm textarea{width:100%}
.soluk{color:var(--soluk);font-size:12.5px}
.bos{text-align:center;color:var(--soluk);padding:28px 12px;font-size:13.5px}
.iyi-y{color:var(--iyi);font-weight:600}.uyari-y{color:var(--uyari);font-weight:600}.kotu-y{color:var(--kotu);font-weight:600}
.canli{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--iyi);margin-right:6px;animation:yanip 1.8s infinite}
@keyframes yanip{50%{opacity:.25}}
/* ---------- misafir menüsü ---------- */
.vitrin{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:center;background:var(--kart);
 border:1px solid var(--cizgi);border-radius:var(--r);padding:26px 28px;margin-bottom:20px;overflow:hidden}
.vitrin h1{font-size:34px;line-height:1.15;margin-bottom:8px}
.vitrin p{color:var(--ikincil);margin:0 0 16px;max-width:52ch}
.vitrin .bilgiler{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ikincil)}
.vitrin .fincan{display:flex;align-items:center;justify-content:center;font-size:96px;line-height:1;
 background:radial-gradient(circle at 50% 40%,var(--kart2),transparent 70%);border-radius:50%;aspect-ratio:1;max-width:220px;justify-self:center}
.menu-duzen{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
.kat-serit{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;z-index:5;
 background:var(--kagit);padding:6px 0}
.kat-serit button{background:var(--kart);border:1px solid var(--cizgi);border-radius:99px;padding:7px 15px;font:inherit;font-size:13px;cursor:pointer;color:var(--murekkep)}
.kat-serit button.on{background:var(--panel);color:#fff;border-color:var(--panel)}
.urun{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--cizgi);align-items:center}
.urun:last-child{border-bottom:none}
.urun .simge{width:46px;height:46px;border-radius:12px;background:var(--kart2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.urun .ad{flex:1;min-width:0}
.urun .ad b{display:block;font-size:14.5px;font-weight:600}
.urun .ad span{display:block;font-size:12.5px;color:var(--soluk);margin-top:2px}
.urun .fyt{font-family:'Fraunces',serif;font-weight:600;font-size:16px;white-space:nowrap;margin-right:4px}
.urun.yok{opacity:.5}
.sayac{display:flex;align-items:center;gap:7px}
.sayac button{width:30px;height:30px;border-radius:9px;border:1px solid var(--cizgi);background:var(--kart);
 font-size:17px;line-height:1;cursor:pointer;color:var(--murekkep);font-family:inherit}
.sayac button:hover{background:var(--kart2);border-color:var(--bakir)}
.sayac b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.sepet{position:sticky;top:16px}
.sepet .sat{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--cizgi)}
.sepet .top{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--ikincil)}
.sepet .top.ana{font-size:17px;font-family:'Fraunces',serif;font-weight:600;color:var(--murekkep);
 border-top:1px solid var(--cizgi);margin-top:10px;padding-top:12px}
/* ---------- süreç akışı ---------- */
.akis{display:flex;margin:4px 0 18px;flex-wrap:wrap}
.akis .adm{flex:1;min-width:104px;text-align:center;position:relative;padding-top:32px}
.akis .adm:before{content:"";position:absolute;top:12px;left:0;right:0;height:3px;background:var(--cizgi)}
.akis .adm:first-child:before{left:50%}.akis .adm:last-child:before{right:50%}
.akis .adm i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:99px;
 background:var(--kart);border:3px solid var(--cizgi);font-style:normal;font-size:12px;line-height:18px;color:#fff}
.akis .adm.bitti:before{background:var(--iyi)}
.akis .adm.bitti i{background:var(--iyi);border-color:var(--iyi)}
.akis .adm.simdi i{background:var(--bakir);border-color:var(--bakir);animation:nabiz 1.6s infinite}
.akis .adm.simdi:before{background:linear-gradient(90deg,var(--iyi) 50%,var(--cizgi) 50%)}
@keyframes nabiz{0%,100%{box-shadow:0 0 0 4px rgba(192,118,58,.28)}50%{box-shadow:0 0 0 9px rgba(192,118,58,.06)}}
.akis .adm b{display:block;font-size:12.5px;font-weight:600;font-family:'IBM Plex Sans',sans-serif}
.akis .adm span{display:block;font-size:11.5px;color:var(--soluk);margin-top:2px;min-height:15px}
.cubuk{height:9px;border-radius:99px;background:var(--notr-bg);overflow:hidden;margin:10px 0 8px}
.cubuk i{display:block;height:100%;background:var(--iyi);transition:width .6s}
.cubuk.uyari i{background:var(--uyari)}.cubuk.kotu i{background:var(--kotu)}
.zc{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--cizgi)}
.zc li{position:relative;padding:0 0 16px 14px}
.zc li:last-child{padding-bottom:0}
.zc li:before{content:"";position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:99px;
 background:var(--iyi);border:2px solid var(--kart);box-shadow:0 0 0 2px var(--iyi)}
.zc li.bekler:before{background:var(--kart);box-shadow:0 0 0 2px var(--cizgi)}
.zc b{display:block;font-size:13.5px;font-family:'IBM Plex Sans',sans-serif;font-weight:600}
.zc span{font-size:12px;color:var(--soluk)}
.zc em{font-style:normal;float:right;font-size:12px;color:var(--ikincil);font-family:'IBM Plex Mono',monospace}
/* ---------- bar / mutfak ekranı ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.kutuk{background:var(--kart2);border-radius:var(--r);padding:10px;min-height:120px}
.kutuk h3{margin:3px 5px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ikincil);
 font-family:'IBM Plex Sans',sans-serif;font-weight:600;display:flex;justify-content:space-between}
.kutuk h3 em{font-style:normal;background:var(--kart);border-radius:99px;padding:0 8px;color:var(--murekkep)}
.fis{background:var(--kart);border:1px solid var(--cizgi);border-left:4px solid var(--sage);border-radius:10px;
 padding:12px 13px;margin-bottom:10px;box-shadow:var(--golge)}
.fis.gec{border-left-color:var(--kotu)}
.fis.yakin{border-left-color:var(--uyari)}
.fis .ust{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.fis .kod{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13.5px;white-space:nowrap}
.fis ul{margin:7px 0 9px;padding-left:17px;font-size:13px}
.fis ul li{margin-bottom:3px}
.fis ul li.bar{color:var(--bilgi)}
.fis .not{background:var(--uyari-bg);color:var(--uyari);border-radius:7px;padding:6px 9px;font-size:11.5px;margin-bottom:9px}
.fis .sur{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ikincil);margin-bottom:9px;
 font-family:'IBM Plex Mono',monospace}
.fis .sur span{white-space:nowrap}
.fis .eyl{display:flex;gap:6px;flex-wrap:wrap}
.ist{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:5px;
 background:var(--notr-bg);color:var(--ikincil);font-weight:600}
.ist.bar{background:var(--bilgi-bg);color:var(--bilgi)}
.ist.firin{background:var(--uyari-bg);color:var(--uyari)}
/* ---------- hazır panosu ---------- */
.pano{background:var(--panel);color:#fff;border-radius:16px;padding:30px 32px;min-height:62vh}
.pano h2{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--panel-soluk);
 font-family:'IBM Plex Sans',sans-serif;font-weight:600;margin:0 0 20px}
.pano .kodlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.pano .kk{background:var(--panel2);border-radius:14px;padding:20px;text-align:center}
.pano .kk.hazir{background:var(--bakir);color:#1B2320}
.pano .kk b{display:block;font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;letter-spacing:.02em}
.pano .kk span{display:block;font-size:12.5px;margin-top:6px;opacity:.85}
.pano .kk em{font-style:normal;display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;opacity:.7}
/* ---------- grafik ---------- */
.grafik{display:flex;align-items:flex-end;gap:6px;height:158px;padding-top:10px}
.grafik .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.grafik .c i{display:block;width:100%;background:var(--bakir);border-radius:4px 4px 0 0;min-height:2px}
.grafik .c i.bos{background:var(--cizgi)}
.grafik .c b{font-size:10.5px;color:var(--soluk);font-weight:400;margin-top:6px;font-family:'IBM Plex Mono',monospace}
.grafik .c em{font-style:normal;font-size:10.5px;color:var(--ikincil);margin-bottom:4px;font-family:'IBM Plex Mono',monospace}
/* ---------- pencere & bildirim ---------- */
#pencere{position:fixed;inset:0;background:rgba(18,26,23,.55);display:none;align-items:flex-start;justify-content:center;
 padding:40px 16px;overflow-y:auto;z-index:60}
#pencere.ac{display:flex}
#pencere .ic{background:var(--kagit);border-radius:16px;max-width:740px;width:100%;padding:22px 24px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
#pencere .pb{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
#pencere .pb h2{margin:0;font-size:19px}
#pencere .kap{background:none;border:none;font-size:24px;cursor:pointer;color:var(--soluk);line-height:1;padding:0 4px}
#bildirim{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:330px}
#bildirim div{background:var(--panel);color:#fff;padding:12px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 24px rgba(0,0,0,.3);animation:gir .25s}
#bildirim div.ok{background:var(--iyi)}#bildirim div.hata{background:var(--kotu)}
@keyframes gir{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(2,1fr)}.menu-duzen{grid-template-columns:1fr}
 .grid2{grid-template-columns:1fr}.vitrin{grid-template-columns:1fr}.vitrin .fincan{display:none}}
@media(max-width:780px){.app{flex-direction:column}.side{width:100%;height:auto;position:static}
 .side nav{display:flex;flex-wrap:wrap}.side nav a{flex:1 1 auto}.side nav .grp{flex:1 0 100%;padding:10px 12px 2px}
 .main{padding:18px 14px 52px}.kanban{grid-template-columns:1fr}.frm{grid-template-columns:1fr}
 h1{font-size:22px}.vitrin h1{font-size:26px}.kat-serit{position:static}}

/* ---------------- YARDIMCILAR ---------------- */
function simdi(){return Date.now();}
function pd(n){return n<10?"0"+n:""+n;}
function ss(ts){if(!ts)return "—";var d=new Date(ts);return pd(d.getHours())+":"+pd(d.getMinutes());}
function sss(ts){if(!ts)return "—";var d=new Date(ts);return pd(d.getHours())+":"+pd(d.getMinutes())+":"+pd(d.getSeconds());}
function tar(ts){var d=new Date(ts);return pd(d.getDate())+"."+pd(d.getMonth()+1)+"."+d.getFullYear();}
function para(n){return (Math.round(n*100)/100).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺";}
function sure(ms){if(ms==null)return "—";var eksi=ms<0;ms=Math.abs(ms);
 var s=Math.floor(ms/1000),m=Math.floor(s/60),sa=Math.floor(m/60);s=s%60;m=m%60;
 return (eksi?"-":"")+(sa>0?(sa+" sa "+pd(m)+" dk"):(m>0?(m+" dk "+pd(s)+" sn"):(s+" sn")));}
function sureK(ms){if(ms==null)return "—";return (ms<0?"-":"")+Math.round(Math.abs(ms)/60000)+" dk";}
/* mutfak ekranı için kısa sayaç: 9:38 / 1:05:12 */
function sureMM(ms){if(ms==null)return "—";var eksi=ms<0;ms=Math.abs(ms);
 var t=Math.floor(ms/1000),sa=Math.floor(t/3600),m=Math.floor(t/60)%60,sn=t%60;
 return (eksi?"-":"")+(sa>0?(sa+":"+pd(m)+":"+pd(sn)):(m+":"+pd(sn)));}
function farkStr(ms){var m=Math.round(ms/60000);
 if(m===0)return '<span class="soluk">± 0 dk</span>';
 return '<span class="'+(m>0?"kotu-y":"iyi-y")+'">'+(m>0?"+":"−")+Math.abs(m)+" dk</span>";}
function bugunMu(ts){return new Date(ts).toDateString()===new Date().toDateString();}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function rnd(a,b){return a+Math.random()*(b-a);}
function sec(a){return a[Math.floor(Math.random()*a.length)];}
function bildir(m,tip){var k=document.getElementById("bildirim"),d=document.createElement("div");
 d.className=tip||"";d.textContent=m;k.appendChild(d);

/* ══════════════════════════════════════════════════════════════════
   SİPARİŞ MOTORU
   ══════════════════════════════════════════════════════════════════ */
function aktifSayi(){var n=0;for(var i=0;i<VERI.siparisler.length;i++){var s=VERI.siparisler[i];
 if(s.durum!=="teslim"&&s.durum!=="iptal")n++;}return n;}
/* Söz verilen süre: en uzun ürün + adet payı + kuyruk yoğunluğu + teslimat payı */
function sozSure(kalemler,tip){
 var enUzun=0,adet=0;
 for(var i=0;i<kalemler.length;i++){enUzun=Math.max(enUzun,kalemler[i].sure);adet+=kalemler[i].adet;}
 var s=ISLETME.hazirlikPayi+enUzun+Math.max(0,adet-1)*1.2+Math.min(8,aktifSayi()*1.2)+(TIPLER[tip]?TIPLER[tip].ek:0);
 return Math.max(6,Math.round(s));}
function yeniKod(){VERI.sayac++;return ISLETME.kodOnEk+"-"+VERI.sayac;}
function siparis(kod){for(var i=0;i<VERI.siparisler.length;i++)if(VERI.siparisler[i].kod===kod)return VERI.siparisler[i];return null;}

function siparisOlustur(o){
 var t=o.zaman||simdi();
 var s={kod:yeniKod(),kalemler:o.kalemler,tip:o.tip,masa:o.masa||"",magaza:o.magaza||"",kat:o.kat||"",
  ad:o.ad||"Misafir",tel:o.tel||"",not:o.not||"",odeme:o.odeme||"online",
  araToplam:0,servis:0,toplam:0,durum:"yeni",kurye:"",iptalSebep:"",puan:null,
  zaman:{yeni:t,onay:0,hazirlik:0,hazir:0,yolda:0,teslim:0,iptal:0},sozDk:0,ekSure:0,
  oto:{onay:Math.round(rnd(20,70)),hazirlik:Math.round(rnd(12,45)),hazir:0,
       yolda:Math.round(rnd(30,80)),teslim:Math.round(rnd(80,200))},
  gecmis:[{ts:t,dur:"yeni",kim:"Misafir · "+(o.ad||"Misafir"),mesaj:"Sipariş oluşturuldu"}]};
 for(var i=0;i<s.kalemler.length;i++)s.araToplam+=s.kalemler[i].fiyat*s.kalemler[i].adet;
 s.servis=s.tip==="magaza"?ISLETME.kuryeUcreti:0;
 s.toplam=s.araToplam+s.servis;
 s.sozDk=sozSure(s.kalemler,s.tip);
 s.oto.hazir=Math.round(s.sozDk*60*rnd(.35,.6));
 VERI.siparisler.push(s);kaydet();return s;}

function hedefTs(s){return s.zaman.yeni+(s.sozDk+s.ekSure)*60000;}
function kalanMs(s){if(s.durum==="teslim")return hedefTs(s)-s.zaman.teslim;
 if(s.durum==="iptal")return null;return hedefTs(s)-simdi();}
function gecenMs(s){var bit=(s.durum==="teslim"?s.zaman.teslim:(s.durum==="iptal"?s.zaman.iptal:simdi()));
 return bit-s.zaman.yeni;}
function gecikmeMs(s){var k=kalanMs(s);return (k!=null&&k<0)?-k:0;}
function yuzde(s){var top=(s.sozDk+s.ekSure)*60000;return Math.max(3,Math.min(100,Math.round(gecenMs(s)/top*100)));}
function sonTs(s){return s.zaman[s.durum]||s.zaman.yeni;}
function aciliyet(s){if(s.durum==="teslim"||s.durum==="iptal")return "";
 var k=kalanMs(s),top=(s.sozDk+s.ekSure)*60000;
 if(k<0)return "gec";if(k<top*.3)return "yakin";return "";}
function sonraki(s){var a=akisAdimlari(s),i=a.indexOf(s.durum);return (i<0||i>=a.length-1)?null:a[i+1];}

function durumDegis(kod,yeni,kim,sessiz){
 var s=siparis(kod);if(!s)return;var t=simdi();
 s.durum=yeni;s.zaman[yeni]=t;
 if(yeni==="yolda"&&!s.kurye)s.kurye=sec(KURYELER);
 s.gecmis.push({ts:t,dur:yeni,kim:kim||"Sistem",mesaj:durum(yeni).ad});
 kaydet();if(!sessiz)bildir(s.kod+" → "+durum(yeni).ad,yeni==="teslim"?"ok":"");ciz();}
function ilerlet(kod,kim){var s=siparis(kod);if(!s)return;var n=sonraki(s);if(n)durumDegis(kod,n,kim||"Ekip");}
function iptalEt(kod,sebep,kim){var s=siparis(kod);if(!s)return;var t=simdi();
 s.durum="iptal";s.zaman.iptal=t;s.iptalSebep=sebep||"Belirtilmedi";
 s.gecmis.push({ts:t,dur:"iptal",kim:kim||"Sistem",mesaj:"İptal: "+s.iptalSebep});
 kaydet();bildir(s.kod+" iptal edildi","hata");ciz();}
function sureEkle(kod,d){var s=siparis(kod);if(!s)return;s.ekSure+=d;
 s.gecmis.push({ts:simdi(),dur:s.durum,kim:"Ekip",mesaj:"Hazırlık süresi +"+d+" dk uzatıldı"});
 kaydet();bildir(s.kod+" için süre +"+d+" dk");ciz();}

/* otomatik akış — demo mutfak simülasyonu */
function otomatik(){
 if(!VERI.ayar.otomatik)return false;
 var t=simdi(),degisti=false;
 for(var i=0;i<VERI.siparisler.length;i++){
  var s=VERI.siparisler[i];if(s.durum==="teslim"||s.durum==="iptal"||s.elle)continue;
  var gec=(t-sonTs(s))/1000,n=sonraki(s),esik=0;
  if(s.durum==="yeni")esik=s.oto.onay;
  else if(s.durum==="onay")esik=s.oto.hazirlik;
  else if(s.durum==="hazirlik")esik=s.oto.hazir+s.ekSure*60;
  else if(s.durum==="hazir")esik=(s.tip==="magaza"?s.oto.yolda:s.oto.teslim);
  else if(s.durum==="yolda")esik=s.oto.teslim;
  if(n&&gec>=esik){s.durum=n;s.zaman[n]=t;
   if(n==="yolda"&&!s.kurye)s.kurye=sec(KURYELER);
   s.gecmis.push({ts:t,dur:n,kim:(n==="yolda"||n==="teslim")?"Servis":"Bar / Fırın",mesaj:durum(n).ad});
   degisti=true;}}
 if(degisti)kaydet();
 return degisti;}

/* ---------------- ölçümler ---------------- */
function adimSuresi(s,a,b){if(!s.zaman[a]||!s.zaman[b])return null;return s.zaman[b]-s.zaman[a];}
function toplamSure(s){return s.durum==="teslim"?(s.zaman.teslim-s.zaman.yeni):null;}
function zamanindaMi(s){if(s.durum!=="teslim")return null;return s.zaman.teslim<=hedefTs(s);}
function ozet(liste){
 var o={adet:liste.length,ciro:0,teslim:0,iptal:0,aktif:0,geciken:0,urunAdet:0,
  ortOnay:[],ortHazirlik:[],ortTeslim:[],ortToplam:[],zamaninda:0,zamanliTop:0,puanlar:[]};
 for(var i=0;i<liste.length;i++){var s=liste[i];
  if(s.durum!=="iptal"){o.ciro+=s.toplam;for(var j=0;j<s.kalemler.length;j++)o.urunAdet+=s.kalemler[j].adet;}
  if(s.durum==="teslim"){o.teslim++;
   var a=adimSuresi(s,"yeni","onay"),b=adimSuresi(s,"onay","hazir"),c=adimSuresi(s,"hazir","teslim"),d=toplamSure(s);
   if(a!=null)o.ortOnay.push(a);if(b!=null)o.ortHazirlik.push(b);
   if(c!=null)o.ortTeslim.push(c);if(d!=null)o.ortToplam.push(d);
   o.zamanliTop++;if(zamanindaMi(s))o.zamaninda++;
   if(s.puan)o.puanlar.push(s.puan);}
  else if(s.durum==="iptal")o.iptal++;
  else {o.aktif++;if(gecikmeMs(s)>0)o.geciken++;}}
 function ort(a){if(!a.length)return null;var t=0;for(var i=0;i<a.length;i++)t+=a[i];return t/a.length;}
 o.ortOnay=ort(o.ortOnay);o.ortHazirlik=ort(o.ortHazirlik);o.ortTeslim=ort(o.ortTeslim);o.ortToplam=ort(o.ortToplam);
 o.zamanindaYuzde=o.zamanliTop?Math.round(o.zamaninda/o.zamanliTop*100):null;
 o.ortPuan=o.puanlar.length?(o.puanlar.reduce(function(t,v){return t+v;},0)/o.puanlar.length):null;
 o.ortSepet=(o.adet-o.iptal)>0?o.ciro/(o.adet-o.iptal):0;
 return o;}
function bugunkuler(){return VERI.siparisler.filter(function(s){return bugunMu(s.zaman.yeni);});}

var MAGAZALAR=[["Teknoloji Dünyası","1. Kat B-14"],["Moda Point","Zemin Kat C-03"],["Kitap Kahve","1. Kat A-21"],
 ["Optik Vizyon","Zemin Kat D-07"],["Spor Merkezi","3. Kat E-02"],["AVM Yönetim Ofisi","3. Kat Y-01"]];

/* demo kayıtları bugünün açılış saatinden sonrasına taşır (gece yarısına düşmesin) */
function calismaSaatine(t){
 var a=new Date();a.setHours(8,30,0,0);
 var acilis=a.getTime(),simdiki=simdi();
 if(simdiki<=acilis||t>=acilis)return t;
 return Math.round(acilis+Math.random()*(simdiki-acilis));}
function rastgeleSepet(){
 var kalemler=[],n=Math.floor(rnd(1,4)),kul={},acik=tumUrunler().filter(function(u){return !u.kapali;});
 for(var i=0;i<n;i++){var u=sec(acik);if(kul[u.id])continue;kul[u.id]=1;
  kalemler.push({id:u.id,ad:u.ad,fiyat:u.fiyat,sure:u.sure,istasyon:u.istasyon,adet:Math.floor(rnd(1,3))});}
 if(!kalemler.length){var u2=acik[0];kalemler.push({id:u2.id,ad:u2.ad,fiyat:u2.fiyat,sure:u2.sure,istasyon:u2.istasyon,adet:1});}
 return kalemler;}
function demoSiparis(dkOnce,hedef){
 var tip=sec(["masa","masa","gelal","gelal","magaza"]),mg=sec(MAGAZALAR),t=calismaSaatine(simdi()-Math.round(dkOnce*60000));
 var s=siparisOlustur({kalemler:rastgeleSepet(),tip:tip,
  masa:tip==="masa"?("M"+Math.floor(rnd(1,28))):"",
  magaza:tip==="magaza"?mg[0]:"",kat:tip==="magaza"?mg[1]:"",
  ad:sec(ADLAR),tel:"05"+Math.floor(rnd(30,55))+" "+Math.floor(rnd(100,999))+" "+Math.floor(rnd(10,99))+" "+Math.floor(rnd(10,99)),
  not:sec(NOTLAR),odeme:sec(["online","online","kart","nakit"]),zaman:t});
 s.zaman.yeni=t;s.gecmis[0].ts=t;
 if(hedef==="akis")return s;
 var a=akisAdimlari(s),ts=t,ix=a.indexOf(hedef);if(ix<0)ix=a.length-1;
 var gecikmeli=Math.random()<.15;
 for(var i=1;i<=ix;i++){var ad=a[i],art=0;
  if(ad==="onay")art=rnd(20,90);
  else if(ad==="hazirlik")art=rnd(15,60);
  else if(ad==="hazir")art=s.sozDk*60*(gecikmeli?rnd(.8,1.05):rnd(.35,.6));
  else if(ad==="yolda")art=rnd(30,90);
  else if(ad==="teslim")art=(s.tip==="magaza"?rnd(120,260):rnd(40,140));
  ts+=Math.round(art*1000);s.zaman[ad]=ts;
  s.gecmis.push({ts:ts,dur:ad,kim:(ad==="yolda"||ad==="teslim")?"Servis":"Bar / Fırın",mesaj:durum(ad).ad});}
 s.durum=a[ix];
 if(s.durum==="yolda"&&!s.kurye)s.kurye=sec(KURYELER);
 if(s.durum!=="teslim")s.elle=true;
 if(s.durum==="teslim")s.puan=Math.random()<.7?Math.round(rnd(3,5)):null;
 if(Math.random()<.05){s.durum="iptal";s.zaman.iptal=t+80000;
  s.iptalSebep=sec(["Misafir vazgeçti","Ürün tükendi","Yanlış sipariş"]);
  s.gecmis.push({ts:s.zaman.iptal,dur:"iptal",kim:"Kasa",mesaj:"İptal: "+s.iptalSebep});}
 kaydet();return s;}
function demoUret(){
 var n=0,i;
 for(i=0;i<18;i++){demoSiparis(rnd(45,300),"teslim");n++;}
 for(i=0;i<2;i++){demoSiparis(rnd(5,18),sec(["hazir","hazirlik"]));n++;}
 for(i=0;i<4;i++){demoSiparis(rnd(.2,4),"akis");n++;}
 kaydet();bildir(n+" demo sipariş oluşturuldu","ok");ciz();}
function hepsiniSil(){
 if(!confirm("Tüm sipariş kayıtları silinecek. Onaylıyor musunuz?"))return;
 VERI.siparisler=[];VERI.sayac=100;kaydet();bildir("Kayıtlar silindi");ciz();}

function git(h){location.hash="#/"+h;}

function sepetAdet(){var n=0;for(var k in SEPET)n+=SEPET[k];return n;}
function sepetKalemler(){var a=[];for(var k in SEPET){var u=urun(k);
 if(u&&SEPET[k]>0)a.push({id:u.id,ad:u.ad,fiyat:u.fiyat,sure:u.sure,istasyon:u.istasyon,adet:SEPET[k]});}
 return a;}
function sepetTutar(){var a=sepetKalemler(),t=0;for(var i=0;i<a.length;i++)t+=a[i].fiyat*a[i].adet;return t;}
function sepetEkle(uid,d){var n=(SEPET[uid]||0)+d;
 if(n<=0)delete SEPET[uid];else SEPET[uid]=n;sepetKaydet();ciz();}
function sepetBosalt(){SEPET={};sepetKaydet();ciz();}

/* ---------------- ortak parçalar ---------------- */
function rozet(s){var d=durum(s.durum);return '<span class="rz '+d.rz+'">'+d.ad+'</span>';}
function tipRozet(s){return '<span class="rz">'+TIPLER[s.tip].ikon+' '+TIPLER[s.tip].ad+'</span>';}
function nokta(s){
 if(s.tip==="masa")return "Masa "+esc(s.masa);
 if(s.tip==="magaza")return esc(s.magaza)+" · "+esc(s.kat);
 return "Tezgâhtan teslim";}
function hedefBilgi(s){
 if(s.durum==="iptal")return '<span class="soluk">İptal edildi</span>';
 if(s.durum==="teslim"){var z=zamanindaMi(s);
  return '<span class="'+(z?"iyi-y":"kotu-y")+'">'+(z?"Zamanında":"Gecikmeli")+'</span> <span class="soluk">· '+sureK(toplamSure(s))+'</span>';}
 var k=kalanMs(s);
 return '<span class="'+(k<0?"kotu-y":"")+'" data-tik="hedef" data-kod="'+s.kod+'">'+
  (k<0?"Gecikme ":"Kalan ")+'<b class="tnum">'+sure(Math.abs(k))+'</b></span>';}
function akisSerit(s){
 if(s.durum==="iptal")
  return '<div class="kart" style="border-color:var(--kotu);background:var(--kotu-bg)"><b class="kotu-y">Sipariş iptal edildi</b>'+
   '<div class="soluk" style="margin-top:4px">Sebep: '+esc(s.iptalSebep)+' · '+ss(s.zaman.iptal)+'</div></div>';
 var a=akisAdimlari(s),ix=a.indexOf(s.durum),h='<div class="akis">';
 for(var i=0;i<a.length;i++){var d=durum(a[i]),sn=i<ix?"bitti":(i===ix?"simdi":"");
  h+='<div class="adm '+sn+'"><i>'+(i<ix?"✓":"")+'</i><b>'+d.ad+'</b><span>'+
   (s.zaman[a[i]]?ss(s.zaman[a[i]]):(i===ix?"şimdi":""))+'</span></div>';}
 return h+'</div>';}
function zamanCizelge(s){
 var h='<ul class="zc">',a=akisAdimlari(s),g=s.gecmis;
 for(var i=0;i<g.length;i++){var e=g[i],onc=i>0?g[i-1].ts:null;
  h+='<li><em>'+(onc!=null?"+"+sure(e.ts-onc):"başlangıç")+'</em><b>'+esc(e.mesaj)+'</b>'+
   '<span>'+sss(e.ts)+' · '+esc(e.kim)+'</span></li>';}
 if(s.durum!=="teslim"&&s.durum!=="iptal"){var ix=a.indexOf(s.durum);
  for(var j=ix+1;j<a.length;j++){var d=durum(a[j]);
   h+='<li class="bekler"><b class="soluk">'+d.ad+'</b><span>'+d.aciklama+'</span></li>';}}
 return h+'</ul>';}
function olcum(ad,deger,alt,sinif){
 return '<div class="olcum '+(sinif||"")+'"><span>'+ad+'</span><b>'+deger+'</b><i>'+(alt||"")+'</i></div>';}
function kalemSatirlari(s){var h="";
 for(var i=0;i<s.kalemler.length;i++){var k=s.kalemler[i];
  h+='<li class="'+(k.istasyon==="bar"?"bar":"")+'">'+k.adet+' × '+esc(k.ad)+'</li>';}
 return h;}

function istasyonOzet(liste){
 var r={bar:{adet:0,ciro:0},firin:{adet:0,ciro:0}};
 for(var i=0;i<liste.length;i++){var s=liste[i];if(s.durum==="iptal")continue;
  for(var j=0;j<s.kalemler.length;j++){var k=s.kalemler[j],ist=k.istasyon||"firin";
   if(!r[ist])r[ist]={adet:0,ciro:0};
   r[ist].adet+=k.adet;r[ist].ciro+=k.adet*k.fiyat;}}
 return r;}
function saatlikGrafik(liste){
 var say={},enb=0,satir=[];
 var enErken=8,enGec=22;
 for(var i=0;i<liste.length;i++){var sa=new Date(liste[i].zaman.yeni).getHours();say[sa]=(say[sa]||0)+1;
  enErken=Math.min(enErken,sa);enGec=Math.max(enGec,sa);}
 for(var s=enErken;s<=enGec;s++){satir.push([s,say[s]||0]);enb=Math.max(enb,say[s]||0);}
 if(!enb)return '<div class="bos">Bugün için veri yok.</div>';
 var h='<div class="grafik">';
 for(var j=0;j<satir.length;j++){var v=satir[j][1];
  h+='<div class="c"><em>'+(v||"")+'</em><i class="'+(v?"":"bos")+'" style="height:'+Math.round(v/enb*100)+'%"></i>'+
   '<b>'+pd(satir[j][0])+'</b></div>';}
 return h+'</div><div class="soluk" style="text-align:center;margin-top:8px">Saat bazında sipariş adedi</div>';}
function enCokSatan(liste){
 var m={};
 for(var i=0;i<liste.length;i++){var s=liste[i];if(s.durum==="iptal")continue;
  for(var j=0;j<s.kalemler.length;j++){var k=s.kalemler[j];
   if(!m[k.ad])m[k.ad]={adet:0,ciro:0,ist:k.istasyon};
   m[k.ad].adet+=k.adet;m[k.ad].ciro+=k.adet*k.fiyat;}}
 var a=Object.keys(m).map(function(k){return {ad:k,adet:m[k].adet,ciro:m[k].ciro,ist:m[k].ist};})
  .sort(function(x,y){return y.adet-x.adet;}).slice(0,8);
 if(!a.length)return '<div class="bos">Bugün için veri yok.</div>';
 var enb=a[0].adet,h='<table class="tbl"><tbody>';
 for(var t=0;t<a.length;t++)
  h+='<tr><td style="width:38%">'+esc(a[t].ad)+'</td>'+
   '<td style="min-width:130px"><div class="cubuk" style="margin:0"><i style="width:'+Math.round(a[t].adet/enb*100)+'%;background:var(--bakir)"></i></div></td>'+
   '<td class="sag">'+a[t].adet+'</td><td class="sag">'+para(a[t].ciro)+'</td></tr>';
 return h+'</tbody></table>';}

function tikGuncelle(){
 var els=document.querySelectorAll("[data-tik]");
 for(var i=0;i<els.length;i++){
  var el=els[i],s=siparis(el.getAttribute("data-kod"));if(!s)continue;
  var tip=el.getAttribute("data-tik");
  if(tip==="gecen")el.textContent=sure(gecenMs(s));
  else if(tip==="gecen-k")el.textContent=sureMM(gecenMs(s));
  else if(tip==="kalankutu"){var kk=kalanMs(s),ac2=aciliyet(s);
   el.className=(kk<0?"kotu-y":(ac2==="yakin"?"uyari-y":"iyi-y"));
   el.innerHTML=(kk<0?"Gecikme ":"Kalan ")+'<b>'+sureMM(Math.abs(kk))+'</b>';}
  else if(tip==="hedef"){var kh=kalanMs(s);
   if(kh==null)return;
   el.className=(kh<0?"kotu-y":"");
   el.innerHTML=(kh<0?"Gecikme ":"Kalan ")+'<b class="tnum">'+sure(Math.abs(kh))+'</b>';}
  else if(tip==="kalan"){var ka=kalanMs(s),aa=aciliyet(s);
   el.textContent=sure(ka);
   el.className="tnum "+(aa==="gec"?"kotu-y":(aa==="yakin"?"uyari-y":""));}
  else if(tip==="gecikme")el.textContent=sure(gecikmeMs(s));
  else if(tip==="adim")el.textContent=sure(simdi()-sonTs(s));
  else if(tip==="adim-dk")el.textContent=sureK(simdi()-sonTs(s));
  else if(tip==="kalan-dk")el.textContent=(kalanMs(s)<0?"birazdan":sureK(kalanMs(s)));
  else if(tip==="cubuk")el.style.width=yuzde(s)+"%";}
 var sa=document.getElementById("saat");
 if(sa)sa.textContent=sss(simdi());}
