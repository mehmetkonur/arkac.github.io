<title>Arkaç AVM — Etkinlik Merkezi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#F5F3EE;color:#22272B;font-size:14px}
a{color:#8A6414;cursor:pointer}

.side nav a:hover{background:#223243;color:#fff}
.side nav a.on{background:#E5A93D;color:#1B2530;font-weight:600}
.side-foot{padding:12px 14px;border-top:1px solid #233444;font-size:12px}
.side-foot .mut2{color:#63707C;font-size:10.5px;line-height:1.5;margin-top:8px}
.sbtn{display:block;width:100%;text-align:center;background:#223243;color:#B9C4CD;border:none;border-radius:7px;padding:7px;font-size:12px;cursor:pointer;margin-bottom:6px;font-family:inherit}
.sbtn:hover{background:#2B3D4E;color:#fff}
.langs{display:flex;gap:4px;margin:0 0 8px}
.langs a{flex:1;text-align:center;font-size:10.5px;letter-spacing:.05em;color:#7E8B96;text-decoration:none;border:1px solid #2B3D4E;border-radius:6px;padding:3px 0}
.langs a.on{background:#E5A93D;color:#1B2530;border-color:#E5A93D;font-weight:700}
.main{flex:1;padding:26px 30px;min-width:0}
h1{font-size:21px;margin:0 0 4px}
.sub{color:#6B7480;font-size:13px;margin:0 0 20px}
.card{background:#fff;border:1px solid #E7E2D8;border-radius:12px;padding:18px 20px;margin-bottom:18px}
.card h2{font-size:14px;margin:0 0 12px;color:#3A414A}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid #E7E2D8;border-radius:12px;padding:14px 16px}

.kpi span{font-size:11.5px;color:#6B7480;text-transform:uppercase;letter-spacing:.05em}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8A8F98;padding:8px 10px;border-bottom:1px solid #E7E2D8;white-space:nowrap}

.bd.yesil{background:#E4F2E6;color:#2C7A39}

.btn:hover{background:#D89827}
.btn-ghost{display:inline-block;background:#fff;border:1px solid #D8D2C4;color:#3A414A;padding:6px 12px;border-radius:8px;font-size:12.5px;text-decoration:none;cursor:pointer;font-family:inherit}

.frm input,.frm select,.frm textarea{width:100%}

.flash.error{background:#FBE3E1;color:#AE3B32;border:1px solid #EFC4BF}

.ecard{background:#fff;border:1px solid #E7E2D8;border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}

.ekapak img{width:100%;height:100%;object-fit:cover}
.egov{padding:11px 13px;flex:1;display:flex;flex-direction:column;gap:4px}
.ead{font-size:14px;font-weight:600}
.emeta{font-size:12px;color:#6B7480}
.eust{display:flex;justify-content:space-between;align-items:center;gap:6px}
.yild{color:#E5A93D;letter-spacing:1px}

.prog{height:7px;background:#ECE8DE;border-radius:99px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:#E5A93D}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.fkut{position:relative;border-radius:9px;overflow:hidden;border:1px solid #E7E2D8;height:110px;cursor:pointer}
.fkut img{width:100%;height:100%;object-fit:cover;display:block}
.fsil{position:absolute;top:5px;right:5px;background:rgba(24,36,48,.75);color:#fff;border:none;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:13px;line-height:1}
.fbox{position:fixed;inset:0;background:rgba(15,24,32,.92);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:20px}

.madde .tamamx{text-decoration:line-through;color:#8A8F98}

.stars button.dolu{color:#E5A93D}
.crow{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}

.crow .cb{flex:1;height:16px;background:#ECE8DE;border-radius:5px;overflow:hidden}
.crow .cb i{display:block;height:100%;background:#E5A93D}
.crow .cv{width:90px;flex-shrink:0;text-align:right;color:#6B7480;font-size:12.5px}
.detK{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}

.auth .box{background:#fff;border-radius:14px;padding:28px 30px 26px;width:380px;max-width:94vw}
.auth h1{font-size:20px;margin:0 0 4px}
.auth p.d{color:#6B7480;font-size:13px;margin:0 0 8px}
.auth .alt{margin-top:16px;font-size:13px;color:#6B7480;text-align:center}
.auth label{display:block;font-size:12px;color:#6B7480;margin:12px 0 5px;font-weight:600}
.auth input{width:100%}
.auth .btn{width:100%;margin-top:18px;padding:11px}
.alogo{color:#fff;text-align:center;margin-bottom:14px;font-weight:700;font-size:22px;letter-spacing:.05em}
.alogo span{color:#E5A93D}
.alogo small{display:block;font-weight:400;font-size:11px;color:#7E8B96;letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
.alangs{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.alangs a{font-size:11.5px;letter-spacing:.05em;color:#7E8B96;text-decoration:none;border:1px solid #2B3D4E;border-radius:6px;padding:3px 12px;cursor:pointer}
.alangs a.on{background:#E5A93D;color:#1B2530;border-color:#E5A93D;font-weight:700}
.pill{background:#D9534F;color:#fff;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:4px;font-style:normal}
.uname{color:#fff;font-size:13px;font-weight:600}
.urole{font-size:11px;color:#E5A93D;margin:1px 0 8px}
.cikis{color:#B9C4CD;font-size:12px;cursor:pointer;text-decoration:underline}
#acilis{position:fixed;inset:0;background:#182430;z-index:200;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s}
#acilis.git{opacity:0;pointer-events:none}
.a-orta{text-align:center;position:relative;z-index:3}
.a-yildiz{font-size:34px;color:#E5A93D;animation:aYil 1.4s ease-in-out infinite}
.a-logo{color:#fff;font-weight:700;font-size:30px;letter-spacing:.06em;margin-top:6px;animation:aGel .9s ease both}
.a-logo span{color:#E5A93D}
.a-sub{color:#7E8B96;font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;margin-top:8px;animation:aGel .9s .35s ease both}
.a-bar{width:190px;height:5px;background:#233444;border-radius:99px;margin:22px auto 0;overflow:hidden}
.a-bar i{display:block;height:100%;width:0;background:#E5A93D;border-radius:99px;animation:aBar 2.5s .2s ease forwards}
.a-balon{position:absolute;bottom:-90px;width:46px;height:58px;border-radius:50% 50% 48% 48%;opacity:.9;animation:aBal 3.1s ease-in forwards}
.a-balon:after{content:"";position:absolute;left:50%;bottom:-26px;width:1.5px;height:26px;background:rgba(255,255,255,.45);transform:translateX(-50%)}
.a-balon.b1{left:16%;background:#E5A93D;animation-delay:.1s}
.a-balon.b2{left:50%;background:#4C7FC0;width:38px;height:48px;animation-delay:.45s}
.a-balon.b3{left:79%;background:#C24A40;width:42px;height:53px;animation-delay:.28s}
.a-k{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:aKon 2.6s linear infinite}
.a-k:nth-child(odd){background:#E5A93D}
.a-k:nth-child(3n){background:#4C7FC0;width:7px;height:7px;border-radius:50%}
.a-k:nth-child(4n){background:#C24A40}
.a-k:nth-child(5n){background:#7BB77E}
.a-k.k1{left:6%;animation-delay:0s}.a-k.k2{left:14%;animation-delay:.7s}
.a-k.k3{left:23%;animation-delay:.3s}.a-k.k4{left:32%;animation-delay:1.1s}
.a-k.k5{left:41%;animation-delay:.5s}.a-k.k6{left:50%;animation-delay:1.4s}
.a-k.k7{left:59%;animation-delay:.2s}.a-k.k8{left:68%;animation-delay:.9s}
.a-k.k9{left:77%;animation-delay:.6s}.a-k.k10{left:86%;animation-delay:1.2s}
.a-k.k11{left:93%;animation-delay:.4s}.a-k.k12{left:47%;animation-delay:1.7s}
@keyframes aBal{0%{transform:translateY(0) rotate(-3deg)}100%{transform:translateY(-118vh) rotate(4deg)}}
@keyframes aKon{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(112vh) rotate(340deg)}}
@keyframes aYil{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.25);opacity:1}}
@keyframes aGel{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes aBar{to{width:100%}}
@media(max-width:920px){
 .app{flex-direction:column}
 .side{width:100%;height:auto;position:static}
 .grid2{grid-template-columns:1fr}
 .frm{grid-template-columns:1fr}
 .main{padding:16px}
}
@media print{
 .side,.btn,.btn-ghost,.btn-danger,.kaldir,.fsil,.uyari,#acilis{display:none!important}
 .app{display:block}
 .main{padding:0}
 body{background:#fff}
 textarea,input{border:1px solid #bbb}
}
</style>

<script>
"use strict";
/* ================ DEPO ================ */
var idb=null, idbVar=(typeof indexedDB!=="undefined"), RAM={ev:{},foto:{},top:{},kul:{},log:{}};
var _oturumRam={};
function dOku(k){try{return localStorage.getItem(k);}catch(e){return _oturumRam[k]||null;}}
function dYaz(k,v){try{localStorage.setItem(k,v);}catch(e){_oturumRam[k]=v;}}
function dSil(k){try{localStorage.removeItem(k);}catch(e){delete _oturumRam[k];}}
function idbBaslat(){return new Promise(function(res){
 if(!idbVar)return res();
 var r;try{r=indexedDB.open("arkac_etkinlik",3);}catch(e){idbVar=false;return res();}
 r.onupgradeneeded=function(e){var d=e.target.result;
  if(!d.objectStoreNames.contains("ev"))d.createObjectStore("ev",{keyPath:"id"});
  if(!d.objectStoreNames.contains("foto"))d.createObjectStore("foto",{keyPath:"id"});
  if(!d.objectStoreNames.contains("top"))d.createObjectStore("top",{keyPath:"id"});
  if(!d.objectStoreNames.contains("kul"))d.createObjectStore("kul",{keyPath:"id"});
  if(!d.objectStoreNames.contains("log"))d.createObjectStore("log",{keyPath:"id"});};
 r.onsuccess=function(e){idb=e.target.result;res();};
 r.onerror=function(){idbVar=false;res();};});}
function hepsi(st){return new Promise(function(res){
 if(!idbVar)return res(Object.keys(RAM[st]).map(function(k){return RAM[st][k];}));
 var rq=idb.transaction(st).objectStore(st).getAll();
 rq.onsuccess=function(){res(rq.result||[]);};rq.onerror=function(){res([]);};});}
function koy(st,v){return new Promise(function(res){
 if(!idbVar){RAM[st][v.id]=v;return res();}
 var t2=idb.transaction(st,"readwrite");t2.objectStore(st).put(v);
 t2.oncomplete=function(){res();};t2.onerror=function(){res();};});}
function silK(st,id){return new Promise(function(res){
 if(!idbVar){delete RAM[st][id];return res();}
 var t2=idb.transaction(st,"readwrite");t2.objectStore(st).delete(id);
 t2.oncomplete=function(){res();};t2.onerror=function(){res();};});}

/* ================ DİL ================ */
var DILLER=["tm","tr","ru","en"], DILK="arkac_em_dil";
var dil=dOku(DILK)||"tr"; if(DILLER.indexOf(dil)<0)dil="tr";
function d(tr,tm,ru,en){return{tr:tr,tm:tm,ru:ru,en:en};}
function t(k){var m=T[k],s=(m&&(m[dil]||m.tr))||k;
 for(var i=1;i<arguments.length;i++){var ix="{"+(i-1)+"}";
  if(s.indexOf(ix)>=0)s=s.split(ix).join(arguments[i]);
  else s=s.replace("{}",arguments[i]);}
 return s;}
var AY={tr:["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"],
 tm:["Ýanwar","Fewral","Mart","Aprel","Maý","Iýun","Iýul","Awgust","Sentýabr","Oktýabr","Noýabr","Dekabr"],
 ru:["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],
 en:["January","February","March","April","May","June","July","August","September","October","November","December"]};
function ay(i){return (AY[dil]||AY.tr)[i];}
var T={
/* genel */
kaydet:d("Kaydet","Ýatda sakla","Сохранить","Save"),
vazgec:d("Vazgeç","Ýatyr","Отмена","Cancel"),
duzenle:d("Düzenle","Üýtget","Изменить","Edit"),
sil:d("Sil","Poz","Удалить","Delete"),
filtre:d("Filtrele","Süz","Фильтр","Filter"),
ac:d("Aç","Aç","Открыть","Open"),
yazdir:d("Yazdır","Çap et","Печать","Print"),
gun:d("gün","gün","дн.","days"),
gunKaldi:d("{} gün kaldı","{} gün galdy","осталось {} дн.","{} days left"),
tarihGecti:d("tarih geçti","möhleti geçdi","дата прошла","date passed"),
secilmedi:d("— Seçilmedi —","— Saýlanmady —","— Не выбрано —","— Not selected —"),
etkinlik:d("Etkinlik","Çäre","Мероприятие","Event"),
yil:d("Yıl","Ýyl","Год","Year"),
puan:d("Puan","Bal","Балл","Score"),
anket:d("QR anket","QR anketa","QR-опрос","QR survey"),
ziyaretci:d("Ziyaretçi","Myhman","Посетители","Visitors"),
maliyet:d("Maliyet","Çykdajy","Затраты","Cost"),
gelir:d("Gelir","Girdeji","Доход","Revenue"),
netMaliyet:d("Net maliyet","Arassa çykdajy","Чистые затраты","Net cost"),
karsilamaL:d("Karşılama","Ödew %","Окупаемость","Coverage"),
sapmaL:d("Bütçe sapması","Býujet gyşarmasy","Отклонение бюджета","Budget variance"),
trafik:d("Trafik etkisi","Trafige täsiri","Влияние на трафик","Traffic uplift"),
butce:d("Bütçe","Býujet","Бюджет","Budget"),
tarihL:d("Tarih","Sene","Дата","Date"),
yerL:d("Yer","Ýeri","Место","Venue"),
sorumluL:d("Sorumlu","Jogapkär","Ответственный","Responsible"),
durumL:d("Durum","Ýagdaý","Статус","Status"),
turL:d("Tür","Görnüşi","Тип","Type"),
kisi:d("kişi","adam","чел.","people"),
puanYok:d("Puanlanmadı","Baha berilmedi","Без оценки","Not rated"),
kayitYok:d("Kayıt bulunamadı.","Ýazgy tapylmady.","Записи не найдены.","No records found."),
/* durum/tekrar/tur */
d_planlandi:d("Planlandı","Meýilleşdirildi","Запланировано","Planned"),
d_devam:d("Devam Ediyor","Dowam edýär","В процессе","In progress"),
d_tamamlandi:d("Tamamlandı","Tamamlandy","Завершено","Completed"),
d_iptal:d("İptal","Ýatyryldy","Отменено","Cancelled"),
tk_evet:d("Evet, tekrarlanmalı","Hawa, gaýtalansyn","Да, повторить","Yes, repeat"),

/* ================ YARDIMCI ================ */
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function hash(t2){var h1=0xdeadbeef,h2=0x41c6ce57,i,ch;
 for(i=0;i<t2.length;i++){ch=t2.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
 h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
 return (h2>>>0).toString(16)+(h1>>>0).toString(16);}
function simdi(){var n=new Date();function p(x){return (x<10?"0":"")+x;}
 return n.getFullYear()+"-"+p(n.getMonth()+1)+"-"+p(n.getDate())+" "+p(n.getHours())+":"+p(n.getMinutes());}
function bugun(){return simdi().slice(0,10);}
function tarih(v){if(!v)return "—";var p=v.slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:v;}
function gunFark(v){if(!v)return null;var p=v.slice(0,10).split("-"),b=bugun().split("-");
 return Math.round((Date.UTC(+p[0],+p[1]-1,+p[2])-Date.UTC(+b[0],+b[1]-1,+b[2]))/86400000);}
function para(v){if(v==null||v==="")return "—";var n=Number(v);if(isNaN(n))return esc(v);
 var s=n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,".").replace(/\.(\d\d)$/,",$1");
 return s.slice(-3)===",00"?s.slice(0,-3):s;}
function sayi(v){v=(v==null?"":String(v)).replace(",",".").trim();if(v==="")return null;var n=parseFloat(v);return isNaN(n)?null:n;}
function fd(ev,n){return (new FormData(ev.target).get(n)||"").toString().trim();}
function yildiz(p){if(!p)return '<span class="mut">'+t("puanYok")+'</span>';var h='<span class="yild">';
 for(var i=1;i<=5;i++)h+=i<=p?"★":'<span class="bos">★</span>';return h+"</span>";}
function yil(v){return v?v.slice(0,4):"";}
function ort(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function topla(a){return a.reduce(function(x,y){return x+(y||0);},0);}
function gunSayisi(y,m){return new Date(y,m,0).getDate();}
function farkGun(a,b){var p=a.split("-"),q=b.split("-");
 return Math.round((Date.UTC(+q[0],+q[1]-1,+q[2])-Date.UTC(+p[0],+p[1]-1,+p[2]))/86400000);}
function tarihEkleGun(t2,n){var p=t2.split("-");
 var d2=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n));return d2.toISOString().slice(0,10);}
function kaydir(t2){if(!t2)return null;return (+t2.slice(0,4)+1)+t2.slice(4);}
function seriKey(e){return ((e.seri||e.adx)||"").trim();}

function oneriBankasi(e){
 var g=[],u=uplift(e),ka=karsilama(e),sp=sapma(e);
 var kf=null;if(e.pZiyaret&&e.gZiyaret!=null)kf=Math.round((e.gZiyaret-e.pZiyaret)*100/e.pZiyaret);
 if((e.anket!=null&&e.anket<3.5)||(e.puan&&e.puan<=3))g.push({b:t("b_mem"),f:[t("bMem1"),t("bMem2"),t("bMem3"),t("bMem4")]});
 if(!e.gGelir||(ka!==null&&ka<60))g.push({b:t("b_gel"),f:[t("bGel1"),t("bGel2"),t("bGel3"),t("bGel4")]});
 if(u!==null&&u<15)g.push({b:t("b_traf"),f:[t("bTraf1"),t("bTraf2"),t("bTraf3"),t("bTraf4")]});
 if(kf!==null&&kf<=-15)g.push({b:t("b_kat"),f:[t("bKat1"),t("bKat2"),t("bKat3")]});
 if(kf!==null&&kf>=15)g.push({b:t("b_kap"),f:[t("bKap1"),t("bKap2"),t("bKap3")]});
 if(sp!==null&&sp>10)g.push({b:t("b_but"),f:[t("bBut1"),t("bBut2"),t("bBut3")]});
 if(!g.length)g.push({b:t("b_buy"),f:[t("bBuy1"),t("bBuy2"),t("bBuy3"),t("bBuy4")]});

function yorumOlustur(e){
 var c=[],iyi=0,kotu=0;
 var u=uplift(e),ka=karsilama(e),sp=sapma(e);
 if(u!==null){if(u>=30){c.push(t("y_traf_hi",u));iyi++;}
  else if(u>=10){c.push(t("y_traf_orta",u));iyi++;}
  else{c.push(t("y_traf_dusuk",u));kotu++;}}
 if(e.anket!=null){if(e.anket>=4.3){c.push(t("y_anket_hi",Number(e.anket).toFixed(1)));iyi++;}
  else if(e.anket<3){c.push(t("y_anket_lo",Number(e.anket).toFixed(1)));kotu++;}}
 if(e.puan&&e.anket!=null){var fark=e.puan-e.anket;
  if(fark>=1){c.push(t("y_gap1"));kotu++;}
  else if(fark<=-1){c.push(t("y_gap2"));iyi++;}}
 if(e.gMaliyet!=null){
  if(!e.gGelir){c.push(t("y_gelir_yok"));kotu++;}
  else if(ka!==null){
   if(ka>=100){c.push(t("y_kendini",ka));iyi++;}
   else if(ka<60){c.push(t("y_gelir_dusuk",ka));kotu++;}
   else c.push(t("y_karsilama",ka));}}
 var kf=null;if(e.pZiyaret&&e.gZiyaret!=null)kf=Math.round((e.gZiyaret-e.pZiyaret)*100/e.pZiyaret);
 if(kf!==null){if(kf>=15){c.push(t("y_kat_hi",kf));iyi++;}
  else if(kf<=-15){c.push(t("y_kat_lo",Math.abs(kf)));kotu++;}}
 if(sp!==null&&sp>10){c.push(t("y_butce",sp));kotu++;}
 var onceki=oncekiEtkinlik(e);
 if(onceki&&e.gZiyaret!=null&&onceki.gZiyaret){
  var dg=Math.round((e.gZiyaret-onceki.gZiyaret)*100/onceki.gZiyaret);
  if(dg>=10){c.push(t("y_yoy_art",yil(onceki.bas),dg));iyi++;}
